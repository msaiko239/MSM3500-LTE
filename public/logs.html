<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>AXI Log Viewer</title>

    <!-- Bootstrap -->
    <link 
      rel="stylesheet" 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />

    <!-- Font Awesome -->
    <link 
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Sidebar -->
    <script defer src="js/sidebar.js"></script>

    <!-- Log Loader -->
    <script defer src="js/logs.js"></script>
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <main class="main-content container mt-4">
        <h2 class="mb-3">AXI Communication Log</h2>

        <img src="images/commlog.jpg" class="img-fluid mb-4" style="max-width:300px">

        <div class="card">
            <div class="card-header bg-primary text-white">
                Latest AXI Log
            </div>
            <div class="card-body">
                <pre id="axiLog" class="log-output"></pre>
            </div>
        </div>
    </main>

</body>
</html>
