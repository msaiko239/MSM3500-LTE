<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Send Message</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css" />

    <!-- SIDEBAR -->
    <script defer src="js/sidebar.js"></script>

    <!-- PAGE SCRIPT -->
    <script defer src="js/sendpage.js"></script>
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <main class="main-content container">
        <h2 class="mt-4">Send Message</h2>

        <img src="images/sendmsg.jpg" class="img-fluid mb-3" style="max-width:300px;">

        <form id="sendForm" class="mt-3">

            <label class="form-label">Message:</label>
            <textarea class="form-control mb-3" name="msg" id="msg" rows="4"></textarea>

            <label class="form-label">Staff Member:</label>
            <select id="subscriberSelect" name="msisdn" class="form-select mb-3">
                <option selected disabled>Loading...</option>
            </select>

            <button class="btn btn-primary">Send Message</button>
        </form>
    </main>

</body>
</html>
