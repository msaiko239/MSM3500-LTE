<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Output</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <link rel="stylesheet" href="css/style.css" />

    <!-- Sidebar -->
    <script defer src="js/sidebar.js"></script>

    <!-- Page Script -->
    <script defer src="js/service.js"></script>
</head>

<body>

<div id="sidebar-container"></div>

<main class="main-content container py-4">

    <h2 class="mb-4">
        <i class="fa-solid fa-server me-2"></i> Service Status
    </h2>

    <!-- STATUS CARDS -->
    <div class="row" id="service-status-cards">

        <!-- ASTERISK -->
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm p-3">
                <h5>Asterisk</h5>
                <div id="asterisk-status" class="fs-3"></div>
            </div>
        </div>

        <!-- AXI -->
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm p-3">
                <h5>AXI</h5>
                <div id="axi-status" class="fs-3"></div>
            </div>
        </div>

        <!-- RabbitMQ -->
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm p-3">
                <h5>RabbitMQ</h5>
                <div id="rabbitmq-server-status" class="fs-3"></div>
            </div>
        </div>

    </div>

    <!-- SERVICE OUTPUT SECTIONS -->
    <h3 class="mt-4">Service Output Logs</h3>

    <div id="service-logs">
        <div class="mb-4">
            <h4>Asterisk Output</h4>
            <pre id="asterisk-output" class="p-3 bg-dark text-light rounded"></pre>
        </div>

        <div class="mb-4">
            <h4>AXI Output</h4>
            <pre id="axi-output" class="p-3 bg-dark text-light rounded"></pre>
        </div>

        <div class="mb-4">
            <h4>RabbitMQ Output</h4>
            <pre id="rabbitmq-server-output" class="p-3 bg-dark text-light rounded"></pre>
        </div>
    </div>

</main>

</body>
</html>
